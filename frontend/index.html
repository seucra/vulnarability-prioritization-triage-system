<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vulnerability Prioritization & Triage System</title>
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Master Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Main Application Container -->
    <main class="app-container">
        <!-- View 1: Public Landing Page -->
        <section id="view-home" class="view-section active"></section>

        <!-- View 2: About / Project View -->
        <section id="view-about" class="view-section"></section>

        <!-- View 3: Integrated Documentation -->
        <section id="view-docs" class="view-section"></section>

        <!-- View 4: System Overview Dashboard -->
        <section id="view-dashboard" class="view-section"></section>

        <!-- View 5: Triage Explorer -->
        <section id="view-explorer" class="view-section"></section>

        <!-- View 6: Predictive Workspace -->
        <section id="view-predict" class="view-section"></section>

        <!-- View 7: Prioritization Sandbox -->
        <section id="view-prioritize" class="view-section"></section>

        <!-- View 8: SHAP Explainability -->
        <section id="view-explain" class="view-section"></section>

        <!-- View 9: Research Provenance -->
        <section id="view-provenance" class="view-section"></section>

        <!-- View 10: Authentication Login -->
        <section id="view-login" class="view-section"></section>

        <!-- View 11: Account Registration -->
        <section id="view-register" class="view-section"></section>

        <!-- View 12: User Account Profile -->
        <section id="view-profile" class="view-section"></section>

        <!-- View 13: Administration Workspace (Admin Only) -->
        <section id="view-admin" class="view-section"></section>
    </main>

    <!-- Slide-Over Detail Drawer Modal Container -->
    <div id="detail-modal-container"></div>

    <!-- App Entrypoint Script -->
    <script type="module" src="js/app.js?v=2"></script>
</body>
</html>
